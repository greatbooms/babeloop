services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: babeloop
      POSTGRES_PASSWORD: babeloop
      POSTGRES_DB: babeloop
    # 호스트 5432는 다른 프로젝트(grip-postgres)가 점유 중이라 5433 사용
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babeloop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 호스트 6379는 grip-redis가 점유 중이라 6380 사용
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: babeloop
      MINIO_ROOT_PASSWORD: babeloop-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
